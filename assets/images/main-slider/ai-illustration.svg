<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="aiGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Elements -->
  <circle cx="300" cy="300" r="250" fill="url(#aiGrad1)" opacity="0.05"/>
  <circle cx="300" cy="300" r="200" fill="url(#aiGrad1)" opacity="0.08"/>
  <circle cx="300" cy="300" r="150" fill="url(#aiGrad1)" opacity="0.1"/>
  
  <!-- Grid Pattern Background -->
  <g opacity="0.15">
    <line x1="100" y1="150" x2="500" y2="150" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="250" x2="500" y2="250" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="350" x2="500" y2="350" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="100" y1="450" x2="500" y2="450" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="150" y1="100" x2="150" y2="500" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="250" y1="100" x2="250" y2="500" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="350" y1="100" x2="350" y2="500" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="450" y1="100" x2="450" y2="500" stroke="url(#aiGrad1)" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Central AI Brain/Processor -->
  <g filter="url(#shadow)">
    <!-- Main CPU/Brain Box -->
    <rect x="230" y="230" width="140" height="140" rx="12" fill="url(#aiGrad1)" opacity="0.9"/>
    <rect x="240" y="240" width="120" height="120" rx="8" fill="#1a1a2e" opacity="0.4"/>
    
    <!-- Circuit Pattern Inside -->
    <circle cx="300" cy="300" r="40" fill="none" stroke="url(#aiGrad3)" stroke-width="2" opacity="0.8"/>
    <circle cx="300" cy="300" r="28" fill="none" stroke="url(#aiGrad2)" stroke-width="2" opacity="0.6"/>
    
    <!-- Corner Pins -->
    <circle cx="245" cy="245" r="4" fill="url(#aiGrad3)"/>
    <circle cx="355" cy="245" r="4" fill="url(#aiGrad3)"/>
    <circle cx="245" cy="355" r="4" fill="url(#aiGrad3)"/>
    <circle cx="355" cy="355" r="4" fill="url(#aiGrad3)"/>
    
    <!-- Processing Lines -->
    <line x1="250" y1="280" x2="280" y2="280" stroke="url(#aiGrad3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="250" y1="300" x2="270" y2="300" stroke="url(#aiGrad3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="250" y1="320" x2="280" y2="320" stroke="url(#aiGrad3)" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="320" y1="280" x2="350" y2="280" stroke="url(#aiGrad3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="300" x2="350" y2="300" stroke="url(#aiGrad3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="320" x2="350" y2="320" stroke="url(#aiGrad3)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Neural Network Nodes - Layer 1 (Outer) -->
  <g filter="url(#glow)">
    <!-- Top Nodes -->
    <circle cx="300" cy="80" r="18" fill="url(#aiGrad2)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="80" r="12" fill="#fff" opacity="0.3"/>
    
    <circle cx="200" cy="120" r="16" fill="url(#aiGrad3)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="120" r="10" fill="#fff" opacity="0.3"/>
    
    <circle cx="400" cy="120" r="16" fill="url(#aiGrad3)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="120" r="10" fill="#fff" opacity="0.3"/>
    
    <!-- Side Nodes -->
    <circle cx="80" cy="300" r="18" fill="url(#aiGrad2)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="300" r="12" fill="#fff" opacity="0.3"/>
    
    <circle cx="520" cy="300" r="18" fill="url(#aiGrad2)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="300" r="12" fill="#fff" opacity="0.3"/>
    
    <!-- Bottom Nodes -->
    <circle cx="300" cy="520" r="18" fill="url(#aiGrad2)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="520" r="12" fill="#fff" opacity="0.3"/>
    
    <circle cx="200" cy="480" r="16" fill="url(#aiGrad3)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="480" r="10" fill="#fff" opacity="0.3"/>
    
    <circle cx="400" cy="480" r="16" fill="url(#aiGrad3)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="480" r="10" fill="#fff" opacity="0.3"/>
  </g>
  
  <!-- Neural Network Nodes - Layer 2 (Mid) -->
  <g filter="url(#glow)">
    <circle cx="150" cy="180" r="14" fill="url(#aiGrad1)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="180" r="14" fill="url(#aiGrad1)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="420" r="14" fill="url(#aiGrad1)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="420" r="14" fill="url(#aiGrad1)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Connection Lines with Gradient -->
  <g opacity="0.4">
    <!-- From center to outer nodes -->
    <line x1="300" y1="230" x2="300" y2="80" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="250" y1="250" x2="200" y2="120" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="350" y1="250" x2="400" y2="120" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="230" y1="300" x2="80" y2="300" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="370" y1="300" x2="520" y2="300" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="300" y1="370" x2="300" y2="520" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="250" y1="350" x2="200" y2="480" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    <line x1="350" y1="350" x2="400" y2="480" stroke="url(#aiGrad1)" stroke-width="2.5"/>
    
    <!-- Mid layer connections -->
    <line x1="230" y1="250" x2="150" y2="180" stroke="url(#aiGrad2)" stroke-width="2"/>
    <line x1="370" y1="250" x2="450" y2="180" stroke="url(#aiGrad2)" stroke-width="2"/>
    <line x1="230" y1="350" x2="150" y2="420" stroke="url(#aiGrad2)" stroke-width="2"/>
    <line x1="370" y1="350" x2="450" y2="420" stroke="url(#aiGrad2)" stroke-width="2"/>
  </g>
  
  <!-- Animated Data Particles -->
  <g>
    <circle r="5" fill="#fff" opacity="0.9">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 300 80 L 300 230"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#fff" opacity="0.9">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M 200 120 L 250 250"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#fff" opacity="0.9">
      <animateMotion dur="4.2s" repeatCount="indefinite" path="M 400 120 L 350 250"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#fff" opacity="0.9">
      <animateMotion dur="3.8s" repeatCount="indefinite" path="M 80 300 L 230 300"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#fff" opacity="0.9">
      <animateMotion dur="3.3s" repeatCount="indefinite" path="M 520 300 L 370 300"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating Particles in Background -->
  <g opacity="0.3">
    <circle cx="120" cy="250" r="3" fill="url(#aiGrad3)">
      <animate attributeName="cy" values="250;230;250" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="350" r="3" fill="url(#aiGrad2)">
      <animate attributeName="cy" values="350;370;350" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="400" r="3" fill="url(#aiGrad3)">
      <animate attributeName="cx" values="180;200;180" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="200" r="3" fill="url(#aiGrad2)">
      <animate attributeName="cx" values="420;400;420" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
