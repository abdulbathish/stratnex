<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- AI Brain Network -->
  <defs>
    <linearGradient id="aiGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="200" fill="url(#aiGradient1)" opacity="0.1"/>
  
  <!-- Central Brain -->
  <ellipse cx="250" cy="250" rx="80" ry="90" fill="url(#aiGradient1)" opacity="0.3"/>
  
  <!-- Brain Details -->
  <path d="M 200 230 Q 220 210 250 230 Q 280 210 300 230" stroke="url(#aiGradient1)" stroke-width="3" fill="none"/>
  <path d="M 200 250 Q 225 240 250 250 Q 275 240 300 250" stroke="url(#aiGradient1)" stroke-width="3" fill="none"/>
  <path d="M 200 270 Q 220 280 250 270 Q 280 280 300 270" stroke="url(#aiGradient1)" stroke-width="3" fill="none"/>
  
  <!-- Neural Network Nodes -->
  <circle cx="150" cy="150" r="15" fill="url(#aiGradient2)"/>
  <circle cx="350" cy="150" r="15" fill="url(#aiGradient2)"/>
  <circle cx="150" cy="350" r="15" fill="url(#aiGradient2)"/>
  <circle cx="350" cy="350" r="15" fill="url(#aiGradient2)"/>
  <circle cx="250" cy="100" r="12" fill="#667eea"/>
  <circle cx="250" cy="400" r="12" fill="#667eea"/>
  <circle cx="100" cy="250" r="12" fill="#667eea"/>
  <circle cx="400" cy="250" r="12" fill="#667eea"/>
  
  <!-- Connecting Lines -->
  <line x1="150" y1="150" x2="250" y2="250" stroke="url(#aiGradient1)" stroke-width="2" opacity="0.4"/>
  <line x1="350" y1="150" x2="250" y2="250" stroke="url(#aiGradient1)" stroke-width="2" opacity="0.4"/>
  <line x1="150" y1="350" x2="250" y2="250" stroke="url(#aiGradient1)" stroke-width="2" opacity="0.4"/>
  <line x1="350" y1="350" x2="250" y2="250" stroke="url(#aiGradient1)" stroke-width="2" opacity="0.4"/>
  <line x1="250" y1="100" x2="250" y2="250" stroke="#667eea" stroke-width="2" opacity="0.4"/>
  <line x1="250" y1="400" x2="250" y2="250" stroke="#667eea" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="250" x2="250" y2="250" stroke="#667eea" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="250" x2="250" y2="250" stroke="#667eea" stroke-width="2" opacity="0.4"/>
  
  <!-- Data Particles -->
  <circle cx="180" cy="180" r="4" fill="#f5576c" opacity="0.8">
    <animate attributeName="cy" values="180;200;180" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="180" r="4" fill="#f5576c" opacity="0.8">
    <animate attributeName="cy" values="180;160;180" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="320" r="4" fill="#667eea" opacity="0.8">
    <animate attributeName="cy" values="320;300;320" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="320" r="4" fill="#667eea" opacity="0.8">
    <animate attributeName="cy" values="320;340;320" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- AI Chip Icon -->
  <rect x="220" y="220" width="60" height="60" rx="5" fill="url(#aiGradient1)" opacity="0.8"/>
  <rect x="230" y="230" width="40" height="40" rx="3" fill="white" opacity="0.2"/>
  <line x1="235" y1="240" x2="265" y2="240" stroke="white" stroke-width="2"/>
  <line x1="235" y1="250" x2="265" y2="250" stroke="white" stroke-width="2"/>
  <line x1="235" y1="260" x2="265" y2="260" stroke="white" stroke-width="2"/>
  <line x1="235" y1="270" x2="265" y2="270" stroke="white" stroke-width="2"/>
</svg>

