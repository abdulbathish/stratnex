<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="govGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="govGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="govGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="govGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="govShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Elements -->
  <circle cx="300" cy="320" r="240" fill="url(#govGrad1)" opacity="0.05"/>
  <circle cx="300" cy="320" r="190" fill="url(#govGrad1)" opacity="0.08"/>
  
  <!-- Government Building -->
  <g filter="url(#govShadow)">
    <!-- Building Base -->
    <rect x="130" y="320" width="340" height="180" fill="url(#govGrad1)" opacity="0.4" rx="4"/>
    <rect x="140" y="330" width="320" height="170" fill="#1a1a2e" opacity="0.2"/>
    
    <!-- Windows Pattern -->
    <g opacity="0.6">
      <rect x="155" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="195" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="235" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="275" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="315" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="355" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="395" y="350" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      
      <rect x="155" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="195" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="235" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="275" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="315" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="355" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="395" y="395" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      
      <rect x="155" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="195" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="235" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="275" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="315" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="355" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
      <rect x="395" y="440" width="25" height="30" fill="url(#govGrad2)" opacity="0.3" rx="2"/>
    </g>
    
    <!-- Grand Entrance -->
    <rect x="250" y="380" width="100" height="120" fill="url(#govGrad1)" opacity="0.6" rx="3"/>
    <rect x="260" y="390" width="80" height="110" fill="#1a1a2e" opacity="0.3" rx="2"/>
    
    <!-- Columns -->
    <g opacity="0.8">
      <rect x="155" y="295" width="32" height="205" fill="url(#govGrad1)" rx="6"/>
      <rect x="163" y="295" width="16" height="205" fill="#fff" opacity="0.1"/>
      
      <rect x="210" y="295" width="32" height="205" fill="url(#govGrad1)" rx="6"/>
      <rect x="218" y="295" width="16" height="205" fill="#fff" opacity="0.1"/>
      
      <rect x="265" y="295" width="32" height="205" fill="url(#govGrad1)" rx="6"/>
      <rect x="273" y="295" width="16" height="205" fill="#fff" opacity="0.1"/>
      
      <rect x="320" y="295" width="32" height="205" fill="url(#govGrad1)" rx="6"/>
      <rect x="328" y="295" width="16" height="205" fill="#fff" opacity="0.1"/>
      
      <rect x="375" y="295" width="32" height="205" fill="url(#govGrad1)" rx="6"/>
      <rect x="383" y="295" width="16" height="205" fill="#fff" opacity="0.1"/>
    </g>
    
    <!-- Roof/Pediment -->
    <polygon points="110,295 300,205 490,295" fill="url(#govGrad1)" opacity="0.9"/>
    <polygon points="120,295 300,215 480,295" fill="url(#govGrad2)" opacity="0.3"/>
    <polygon points="130,295 300,225 470,295" fill="#fff" opacity="0.1"/>
    
    <!-- Dome Structure -->
    <g>
      <ellipse cx="300" cy="205" rx="55" ry="32" fill="url(#govGrad1)" opacity="0.85"/>
      <ellipse cx="300" cy="205" rx="45" ry="26" fill="#1a1a2e" opacity="0.3"/>
      <ellipse cx="300" cy="205" rx="35" ry="20" fill="url(#govGrad2)" opacity="0.4"/>
      
      <!-- Dome Support -->
      <rect x="285" y="185" width="30" height="45" fill="url(#govGrad1)" opacity="0.8" rx="3"/>
      <rect x="290" y="185" width="20" height="45" fill="#fff" opacity="0.1"/>
      
      <!-- Top Ornament -->
      <circle cx="300" cy="175" r="18" fill="url(#govGrad2)" opacity="0.9"/>
      <circle cx="300" cy="175" r="12" fill="#fff" opacity="0.3"/>
      <polygon points="300,160 295,175 305,175" fill="url(#govGrad1)"/>
    </g>
  </g>
  
  <!-- Steps -->
  <g opacity="0.6">
    <rect x="110" y="500" width="380" height="10" fill="url(#govGrad1)" opacity="0.5" rx="2"/>
    <rect x="120" y="510" width="360" height="10" fill="url(#govGrad1)" opacity="0.4" rx="2"/>
    <rect x="130" y="520" width="340" height="10" fill="url(#govGrad1)" opacity="0.3" rx="2"/>
  </g>
  
  <!-- Digital Service Icons -->
  
  <!-- E-Documents Icon (Left) -->
  <g filter="url(#govGlow)">
    <rect x="50" y="160" width="70" height="90" fill="#fff" stroke="url(#govGrad1)" stroke-width="3" rx="6" opacity="0.95"/>
    <line x1="65" y1="180" x2="105" y2="180" stroke="url(#govGrad1)" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="200" x2="105" y2="200" stroke="url(#govGrad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="220" x2="95" y2="220" stroke="url(#govGrad3)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="105" cy="170" r="8" fill="url(#govGrad1)"/>
    <path d="M 102 170 L 105 173 L 110 165" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Digital Citizen Icon (Right) -->
  <g filter="url(#govGlow)">
    <circle cx="510" cy="190" r="28" fill="#fff" stroke="url(#govGrad2)" stroke-width="3" opacity="0.95"/>
    <circle cx="510" cy="185" r="12" fill="url(#govGrad2)"/>
    <path d="M 510 197 Q 490 215 485 235 L 535 235 Q 530 215 510 197" fill="url(#govGrad2)"/>
    <circle cx="480" cy="210" r="18" fill="url(#govGrad3)" opacity="0.7"/>
    <circle cx="540" cy="210" r="18" fill="url(#govGrad3)" opacity="0.7"/>
    <text x="480" y="215" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">+</text>
    <text x="540" y="215" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">+</text>
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" begin="1s" repeatCount="indefinite"/>
  </g>
  
  <!-- Cloud Services Icon (Bottom Right) -->
  <g filter="url(#govGlow)">
    <ellipse cx="495" cy="380" rx="38" ry="22" fill="#fff" stroke="url(#govGrad2)" stroke-width="3" opacity="0.95"/>
    <ellipse cx="465" cy="380" rx="28" ry="18" fill="#fff" stroke="url(#govGrad2)" stroke-width="3" opacity="0.95"/>
    <ellipse cx="520" cy="380" rx="22" ry="14" fill="#fff" stroke="url(#govGrad2)" stroke-width="3" opacity="0.95"/>
    <path d="M 445 380 L 535 380 L 535 395 L 445 395 Z" fill="#fff" stroke="url(#govGrad2)" stroke-width="3"/>
    <line x1="470" y1="400" x2="470" y2="415" stroke="url(#govGrad2)" stroke-width="2"/>
    <line x1="490" y1="400" x2="490" y2="420" stroke="url(#govGrad2)" stroke-width="2"/>
    <line x1="510" y1="400" x2="510" y2="415" stroke="url(#govGrad2)" stroke-width="2"/>
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" begin="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Security Shield Icon (Bottom Left) -->
  <g filter="url(#govGlow)">
    <path d="M 85 360 L 60 370 L 60 410 Q 60 435 85 445 Q 110 435 110 410 L 110 370 Z" 
          fill="#fff" stroke="url(#govGrad3)" stroke-width="3" opacity="0.95"/>
    <path d="M 72 390 L 80 402 L 100 380" stroke="url(#govGrad3)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="395" r="25" fill="url(#govGrad3)" opacity="0.2"/>
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </g>
  
  <!-- Mobile/Tablet Icon (Top) -->
  <g filter="url(#govGlow)">
    <rect x="265" y="80" width="50" height="75" fill="#fff" stroke="url(#govGrad1)" stroke-width="3" rx="8" opacity="0.95"/>
    <rect x="275" y="95" width="30" height="45" fill="url(#govGrad1)" opacity="0.3" rx="2"/>
    <circle cx="290" cy="148" r="4" fill="url(#govGrad1)"/>
    <line x1="280" y1="105" x2="300" y2="105" stroke="url(#govGrad2)" stroke-width="2"/>
    <line x1="280" y1="115" x2="300" y2="115" stroke="url(#govGrad2)" stroke-width="2"/>
    <line x1="280" y1="125" x2="295" y2="125" stroke="url(#govGrad2)" stroke-width="2"/>
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </g>
  
  <!-- Animated Connection Lines -->
  <g opacity="0.5">
    <path d="M 95 205 Q 180 250 250 270" stroke="url(#govGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 490 210 Q 400 250 350 270" stroke="url(#govGrad2)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 85 375 Q 180 340 250 315" stroke="url(#govGrad3)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 480 395 Q 400 360 350 330" stroke="url(#govGrad2)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 290 140 Q 295 180 300 220" stroke="url(#govGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Data Flow Particles -->
  <g filter="url(#govGlow)">
    <circle r="4" fill="#fff">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 95 205 Q 180 250 250 270"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#fff">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 490 210 Q 400 250 350 270"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#fff">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 85 375 Q 180 340 250 315"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
