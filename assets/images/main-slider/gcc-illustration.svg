<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="gccGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gccGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gccGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="gccGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gccShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Globe Outline -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="url(#gccGrad1)" stroke-width="2" opacity="0.15"/>
  <circle cx="300" cy="300" r="220" fill="url(#gccGrad1)" opacity="0.05"/>
  
  <!-- Latitude Lines (Horizontal) -->
  <g opacity="0.25">
    <ellipse cx="300" cy="300" rx="220" ry="70" fill="none" stroke="url(#gccGrad1)" stroke-width="1.5"/>
    <ellipse cx="300" cy="300" rx="220" ry="120" fill="none" stroke="url(#gccGrad1)" stroke-width="1.5"/>
    <ellipse cx="300" cy="300" rx="220" ry="170" fill="none" stroke="url(#gccGrad1)" stroke-width="1.5"/>
    <line x1="80" y1="300" x2="520" y2="300" stroke="url(#gccGrad1)" stroke-width="2"/>
  </g>
  
  <!-- Longitude Lines (Vertical) -->
  <g opacity="0.25">
    <line x1="300" y1="80" x2="300" y2="520" stroke="url(#gccGrad1)" stroke-width="2"/>
    <ellipse cx="300" cy="300" rx="50" ry="220" fill="none" stroke="url(#gccGrad1)" stroke-width="1.5"/>
    <ellipse cx="300" cy="300" rx="110" ry="220" fill="none" stroke="url(#gccGrad1)" stroke-width="1.5"/>
    <ellipse cx="300" cy="300" rx="165" ry="220" fill="none" stroke="url(#gccGrad1)" stroke-width="1.5"/>
  </g>
  
  <!-- Continents Simplified Outline -->
  <g opacity="0.2" fill="url(#gccGrad1)">
    <!-- North America -->
    <path d="M 140 180 Q 160 160 180 170 L 190 190 Q 185 205 175 210 L 155 200 Z"/>
    <!-- Europe -->
    <path d="M 310 160 L 330 155 L 340 170 L 325 180 L 310 175 Z"/>
    <!-- Asia -->
    <path d="M 380 180 Q 400 170 420 185 L 430 210 Q 420 225 405 220 L 385 205 Z"/>
    <!-- Africa -->
    <path d="M 305 240 Q 320 230 335 245 L 340 280 Q 330 295 315 290 L 300 270 Z"/>
    <!-- South America -->
    <path d="M 190 340 Q 200 330 210 345 L 215 380 Q 205 390 195 385 L 185 360 Z"/>
    <!-- Australia -->
    <path d="M 430 360 Q 445 355 455 365 L 455 385 Q 445 390 435 385 Z"/>
  </g>
  
  <!-- Global Hub Locations with Enhanced Design -->
  
  <!-- North America Hub -->
  <g filter="url(#gccShadow)">
    <circle cx="160" cy="195" r="22" fill="url(#gccGrad2)" opacity="0.2"/>
    <circle cx="160" cy="195" r="16" fill="url(#gccGrad2)" opacity="0.9"/>
    <circle cx="160" cy="195" r="20" fill="none" stroke="url(#gccGrad2)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="20;32;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="195" r="8" fill="#fff" opacity="0.5"/>
    <text x="160" y="200" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" opacity="0.9">NA</text>
  </g>
  
  <!-- Europe Hub -->
  <g filter="url(#gccShadow)">
    <circle cx="320" cy="170" r="22" fill="url(#gccGrad2)" opacity="0.2"/>
    <circle cx="320" cy="170" r="16" fill="url(#gccGrad2)" opacity="0.9"/>
    <circle cx="320" cy="170" r="20" fill="none" stroke="url(#gccGrad2)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="20;32;20" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="170" r="8" fill="#fff" opacity="0.5"/>
    <text x="320" y="175" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" opacity="0.9">EU</text>
  </g>
  
  <!-- Asia Hub -->
  <g filter="url(#gccShadow)">
    <circle cx="410" cy="200" r="22" fill="url(#gccGrad2)" opacity="0.2"/>
    <circle cx="410" cy="200" r="16" fill="url(#gccGrad2)" opacity="0.9"/>
    <circle cx="410" cy="200" r="20" fill="none" stroke="url(#gccGrad2)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="20;32;20" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="200" r="8" fill="#fff" opacity="0.5"/>
    <text x="410" y="205" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" opacity="0.9">AS</text>
  </g>
  
  <!-- India GCC - Main Hub (Larger and Highlighted) -->
  <g filter="url(#gccGlow)">
    <circle cx="370" cy="280" r="35" fill="url(#gccGrad1)" opacity="0.15"/>
    <circle cx="370" cy="280" r="28" fill="url(#gccGrad1)" opacity="0.95"/>
    <circle cx="370" cy="280" r="33" fill="none" stroke="url(#gccGrad1)" stroke-width="3" opacity="0.7">
      <animate attributeName="r" values="33;45;33" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="280" r="18" fill="#1a1a2e" opacity="0.3"/>
    <circle cx="370" cy="280" r="12" fill="#fff" opacity="0.6"/>
    <text x="370" y="287" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">GCC</text>
  </g>
  
  <!-- Australia Hub -->
  <g filter="url(#gccShadow)">
    <circle cx="440" cy="375" r="20" fill="url(#gccGrad2)" opacity="0.2"/>
    <circle cx="440" cy="375" r="15" fill="url(#gccGrad2)" opacity="0.9"/>
    <circle cx="440" cy="375" r="19" fill="none" stroke="url(#gccGrad2)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="19;30;19" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="375" r="7" fill="#fff" opacity="0.5"/>
    <text x="440" y="380" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" opacity="0.9">AU</text>
  </g>
  
  <!-- South America Hub -->
  <g filter="url(#gccShadow)">
    <circle cx="200" cy="365" r="20" fill="url(#gccGrad2)" opacity="0.2"/>
    <circle cx="200" cy="365" r="15" fill="url(#gccGrad2)" opacity="0.9"/>
    <circle cx="200" cy="365" r="19" fill="none" stroke="url(#gccGrad2)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="19;30;19" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="365" r="7" fill="#fff" opacity="0.5"/>
    <text x="200" y="370" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" opacity="0.9">SA</text>
  </g>
  
  <!-- Middle East Hub -->
  <g filter="url(#gccShadow)">
    <circle cx="340" cy="240" r="18" fill="url(#gccGrad3)" opacity="0.2"/>
    <circle cx="340" cy="240" r="14" fill="url(#gccGrad3)" opacity="0.9"/>
    <circle cx="340" cy="240" r="18" fill="none" stroke="url(#gccGrad3)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="18;28;18" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="240" r="6" fill="#fff" opacity="0.5"/>
    <text x="340" y="245" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold" opacity="0.9">ME</text>
  </g>
  
  <!-- Enhanced Connection Lines with Animation -->
  <g opacity="0.5">
    <!-- From GCC to other hubs -->
    <path d="M 160 195 Q 240 230 340 260" stroke="url(#gccGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 320 170 Q 340 210 360 265" stroke="url(#gccGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 410 200 Q 390 240 375 265" stroke="url(#gccGrad1)" stroke-width="3" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 370 305 Q 405 340 435 365" stroke="url(#gccGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 355 295 Q 280 330 210 360" stroke="url(#gccGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 345 270 Q 342 255 340 248" stroke="url(#gccGrad1)" stroke-width="2.5" fill="none" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Cross connections -->
    <path d="M 160 195 Q 230 180 310 172" stroke="url(#gccGrad2)" stroke-width="1.5" fill="none" stroke-dasharray="4,4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 320 170 Q 365 185 405 198" stroke="url(#gccGrad2)" stroke-width="1.5" fill="none" stroke-dasharray="4,4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Animated Data Flow Particles -->
  <g filter="url(#gccGlow)">
    <!-- Particle 1 -->
    <circle r="4" fill="#fff">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 160 195 Q 240 230 340 260"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 2 -->
    <circle r="4" fill="#fff">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M 320 170 Q 340 210 360 265"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 3 -->
    <circle r="4" fill="#fff">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 410 200 Q 390 240 375 265"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 4 -->
    <circle r="4" fill="#fff">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M 370 305 Q 405 340 435 365"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 5 -->
    <circle r="4" fill="#fff">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M 355 295 Q 280 330 210 360"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Decorative Corner Elements -->
  <g opacity="0.2">
    <circle cx="100" cy="100" r="30" fill="none" stroke="url(#gccGrad1)" stroke-width="2"/>
    <circle cx="500" cy="100" r="30" fill="none" stroke="url(#gccGrad2)" stroke-width="2"/>
    <circle cx="100" cy="500" r="30" fill="none" stroke="url(#gccGrad3)" stroke-width="2"/>
    <circle cx="500" cy="500" r="30" fill="none" stroke="url(#gccGrad1)" stroke-width="2"/>
  </g>
</svg>
